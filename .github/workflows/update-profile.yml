name: Refresh animated profile cards
on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "profile.json"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch contribution JSON
        run: python scripts/fetch_contributions.py
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
      - name: Render SVG cards
        run: python scripts/render_cards.py
      - name: Commit refreshed cards and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
